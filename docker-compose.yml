# Every container's log, capped: Docker otherwise keeps it forever, and on
# a NAS that runs for months that slowly fills the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    # Caddy with the Caddyfile built in (caddy/Dockerfile), released
    # together with web, so a change to it arrives with an update too.
    # Every build takes the newest Caddy 2.x, for its security fixes. A
    # server with a Caddyfile of its own mounts it over
    # /etc/caddy/Caddyfile in docker-compose.override.yml.
    image: "ghcr.io/alitemu/rooster-caddy:${ROOSTER_VERSION:-stable}"
    build:
      context: ./caddy
    ports:
      # Host and container port stay identical - see the note in caddy/Caddyfile.
      # APP_PORT=443 on a server with its own name; 8010 when left out (a
      # NAS that uses 443 itself). Port 80 (http:// sent on to https) is not
      # published here: add it in docker-compose.override.yml (README).
      - "${APP_PORT:-8010}:${APP_PORT:-8010}"
    environment:
      APP_PORT: "${APP_PORT:-8010}"
      # The app's sub-folder, for the redirect from / (see caddy/Caddyfile).
      BASE_PATH: "${BASE_PATH:-}"
    volumes:
      - caddy_data:/data
    networks:
      - internal
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # 127.0.0.1, not localhost: on Alpine localhost can resolve to ::1
    # first, where the admin API does not listen (see Dockerfile).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    # Ready-made by GitHub (.github/workflows/images.yml and release.yml):
    # `docker compose pull` then `docker compose up -d` updates without
    # building anything here. Left out, ROOSTER_VERSION is `stable`: the
    # version released for production. A test installation sets it to
    # `test` (the newest build); a number (e.g. 0.2.3) pins one version.
    # `build` stays for building from source (`docker compose up -d --build`).
    image: "ghcr.io/alitemu/rooster-web:${ROOSTER_VERSION:-stable}"
    build:
      context: .
      dockerfile: Dockerfile
      # Only when building from source: the sub-folder, e.g. /achterwacht
      # (see .env.example). A ready-made image already has its own.
      args:
        BASE_PATH: "${BASE_PATH:-}"
    environment:
      NODE_ENV: production
      # Pinned rather than left to the base image's default (typically
      # UTC) - this app's deadline/date logic is written and tested
      # against a ward operating in this timezone, and letting the
      # container's local timezone drift from that risks an off-by-hours
      # deadline enforcement without any code change ever happening.
      TZ: "${TZ:-Europe/Amsterdam}"
      DATABASE_URL: "file:/data/rooster.db"
      SOLVER_URL: "http://solver:8000"
      # true on a test installation: no mail ever goes out, whatever
      # Mailinstellingen says (see .env.example).
      MAIL_UITGESCHAKELD: "${MAIL_UITGESCHAKELD:-false}"
      # What the first boot of a fresh DATA_DIR creates - see .env.example.
      # Safe to leave set across restarts/reinstalls: after that it only
      # brings the schema up to date.
      #
      # !! The planner account comes out of this WITH a password already
      # set, and that password is checked into this repository
      # (DEFAULT_TEST_PASSWORD in scripts/seed.ts) - deliberately, so the
      # app is immediately usable while it is being built and tested.
      # This comment used to claim the opposite ("neither account gets a
      # password from seeding"), which would leave an operator believing
      # their deployment was still unclaimed while anyone who has seen this
      # repository could log in as planner.
      #
      # Before real staff and real schedules use this: either set
      # SEED_PLANNER_PASSWORD below (which claims the account with your own
      # password instead), or log in once and change it under "Wachtwoord
      # wijzigen". Seeding is not a way to undo a password already set.
      # The app logs a warning on every start while the seeded password is
      # still in place.
      #
      # Defaults to planner: the beheerder account "admin", pool, shift types
      # and notice wording, no demo participants or period, so a production
      # installation never gets demo data by accident. A test installation
      # sets SEED_ON_START=true in .env for the demo data.
      SEED_ON_START: "${SEED_ON_START:-planner}"
      # Optional. Left empty the app generates one on first start and keeps
      # it in DATA_DIR, so sessions survive restarts. Set it here
      # (or in .env) to pin your own: openssl rand -hex 32
      SESSION_SECRET: "${SESSION_SECRET:-}"
      # Left empty (the default), the app auto-detects the address from
      # each request's own Host header - see lib/baseUrl.ts. Set BASE_URL
      # in .env only to pin one fixed address regardless of how the app is
      # reached. A hardcoded localhost fallback here would defeat that
      # auto-detection by always giving the app *something*, even when the
      # operator never set BASE_URL themselves.
      BASE_URL: "${BASE_URL:-}"
      # Optional override for the first seeded account's password - see
      # .env.example. Only has an effect on an account with no password
      # yet. Left unset (the default), docker-entrypoint.sh's claim-password
      # step is skipped entirely.
      SEED_PLANNER_PASSWORD: "${SEED_PLANNER_PASSWORD:-}"
      # Off by default - see .env.example. lib/notifications.ts reads this
      # directly from the process environment, so leaving it out here means
      # it's stuck at "disabled" no matter what a deployment's .env says.
      NOTIFICATIONS_ENABLED: "${NOTIFICATIONS_ENABLED:-false}"
      # Hardcoded true, not an override: in THIS compose file the app is
      # only ever reachable through Caddy, which replaces X-Real-IP with
      # the connecting peer's address (see caddy/Caddyfile), so the header can't
      # be forged. lib/rateLimit.ts therefore uses it to tell clients
      # apart. Any deployment without that guarantee must leave this unset,
      # or a caller could rotate the header past the rate limit - or spoof
      # someone else's address to lock them out.
      TRUST_PROXY_HEADERS: "true"
    volumes:
      # A bind mount to a plain folder next to this file (default ./data),
      # not a Docker-managed named volume - so the database and the
      # preferences CSV backups (lib/preferencesBackup.ts, under
      # data/backups/preferences/) show up as ordinary files/folders in
      # whatever file manager already browses this host (e.g. Synology's
      # File Station), instead of living inside Docker's own hidden
      # volume storage. Override DATA_DIR in .env to point elsewhere - but
      # a custom path must already exist as a real folder before the first
      # `docker compose up` (unlike the default ./data, which ships
      # pre-created via the git-tracked data/.gitkeep), since a bind mount
      # needs somewhere on the host to actually attach to.
      - ${DATA_DIR:-./data}:/data
    networks:
      - internal
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      - solver
    # A tiny init as process 1, so a stop signal reaches the app and the
    # container stops cleanly instead of being killed after 10 seconds.
    init: true
    mem_limit: "${WEB_MEM_LIMIT:-1g}"

  solver:
    # Same release as web, see there.
    image: "ghcr.io/alitemu/rooster-solver:${ROOSTER_VERSION:-stable}"
    build:
      context: ./solver
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-Europe/Amsterdam}"
    # `expose`, not `ports`: a bare `ports: - "8000"` publishes the port to
    # the host on a random ephemeral port, which would put this service -
    # which has no authentication of any kind - on the host's interface.
    # The web container reaches it as solver:8000 over the internal bridge
    # network either way; only caddy should be host-published.
    expose:
      - "8000"
    # It needs no Linux privileges at all, and runs as its own user.
    cap_drop:
      - ALL
    # Generating a roster is the heaviest thing on the NAS; this keeps it
    # from taking all memory. Raise it in .env if a big period needs more.
    mem_limit: "${SOLVER_MEM_LIMIT:-2g}"
    networks:
      - internal
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # "Bijwerken" in the app (README, "Bijwerken vanuit de app"): checks
  # which version is released and, when a beheerder asks, pulls it,
  # restarts web, solver and caddy, and goes back to the previous images
  # if they don't come up healthy (updater/updater.sh). The only service
  # with the Docker socket, which amounts to full control of this host:
  # that is why it is a container of its own that takes no orders but
  # "check" and "update to the released version" - the web app, which
  # faces the network, never gets the socket. A server that must not have
  # it switches the service off in docker-compose.override.yml (README).
  updater:
    image: "ghcr.io/alitemu/rooster-updater:${ROOSTER_VERSION:-stable}"
    build:
      context: ./updater
    environment:
      TZ: "${TZ:-Europe/Amsterdam}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # This folder, to run docker compose with the same files and .env
      # as IT does by hand. Read-only: it changes nothing here.
      - .:/rooster:ro
      # Where it and the app leave each other notes (data/update/).
      - ${DATA_DIR:-./data}:/data
    # Not on `internal`: it never talks to the other services, only to
    # the Docker socket and the registry.
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # Root, for the socket; of root's privileges only what it needs to
    # hand data/update/ to the app's user and write its status there.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    mem_limit: 256m

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
