version: '3.8'

services:
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/rooster.db"
      SOLVER_URL: "http://solver:8000"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in your .env file, e.g. via: openssl rand -hex 32}"
      BASE_URL: "${BASE_URL:-https://localhost:443}"
    volumes:
      - db_data:/data
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - solver

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
    ports:
      - "8000"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  caddy_data:
