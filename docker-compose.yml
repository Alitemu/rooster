version: '3.8'

services:
  caddy:
    image: caddy:2.7-alpine
    ports:
      # Host and container port stay identical - see the note in Caddyfile.
      - "${APP_PORT:-8010}:${APP_PORT:-8010}"
    environment:
      APP_PORT: "${APP_PORT:-8010}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/rooster.db"
      SOLVER_URL: "http://solver:8000"
      # Optional. When true, creates the ADMIN/PLANNER accounts and demo
      # data on first boot of a fresh db_data volume - see .env.example.
      # Safe to leave set across restarts/reinstalls: no-ops once seeded.
      SEED_ON_START: "${SEED_ON_START:-false}"
      # Optional. Left empty the app generates one on first start and keeps
      # it in the db_data volume, so sessions survive restarts. Set it here
      # (or in .env) to pin your own: openssl rand -hex 32
      SESSION_SECRET: "${SESSION_SECRET:-}"
      BASE_URL: "${BASE_URL:-https://localhost:${APP_PORT:-8010}}"
    volumes:
      - db_data:/data
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - solver

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
    # `expose`, not `ports`: a bare `ports: - "8000"` publishes the port to
    # the host on a random ephemeral port, which would put this service -
    # which has no authentication of any kind - on the host's interface.
    # The web container reaches it as solver:8000 over the internal bridge
    # network either way; only caddy should be host-published.
    expose:
      - "8000"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  caddy_data:
