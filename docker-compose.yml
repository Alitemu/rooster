version: '3.8'

services:
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: "file:/data/rooster.db"
      SOLVER_URL: "http://solver:8000"
    volumes:
      - ./:/app
      - /app/node_modules
      - db_data:/data
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - solver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  solver:
    build:
      context: ./solver
      dockerfile: Dockerfile
    environment:
      LOG_LEVEL: INFO
    ports:
      - "8000"
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  caddy_data:
