# "Bouwen (test)": builds the two images the NAS runs and publishes them
# to GitHub's container registry, so the server only downloads them
# (docker compose pull) and never builds anything itself:
#
#   ghcr.io/alitemu/rooster-web:<version> and :test
#   ghcr.io/alitemu/rooster-solver:<version> and :test
#
# <version> is package.json's "version" (the one in the app's header).
# Only ever started by hand (Actions tab > Bouwen (test) > Run workflow),
# and it never touches :stable, which production pulls: a test
# installation runs :test, and "Vrijgeven (productie)" (release.yml)
# moves :stable to a tested version.
#
# Both amd64 and arm64 (most Synology models are amd64, the "j" and value
# series arm64), each built on a machine of its own kind: emulating arm64
# on an amd64 runner took well over an hour for the web image. The two
# halves are then joined into one multi-platform tag, following Docker's
# own "distribute build across multiple runners" recipe.

name: Bouwen (test)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: web, context: . }
          - { name: solver, context: ./solver }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          # Links the package to this repository, so it shows up there and
          # takes its public visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/alitemu/rooster-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Remember the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  tag:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [web, solver]
    steps:
      - uses: actions/checkout@v4

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.name }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join both platforms under the version and test tags
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/alitemu/rooster-${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:test" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "rooster-${{ matrix.name }} $VERSION staat klaar als test." >> "$GITHUB_STEP_SUMMARY"
