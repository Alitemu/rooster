# "Bouwen (test)": builds the two images the NAS runs and publishes them
# to GitHub's container registry, so the server only downloads them
# (docker compose pull) and never builds anything itself:
#
#   ghcr.io/alitemu/rooster-web:<version> and :test
#   ghcr.io/alitemu/rooster-solver:<version> and :test
#
# <version> is package.json's "version" (the one in the app's header).
# Only ever started by hand (Actions tab > Bouwen (test) > Run workflow),
# and it never touches :stable, which production pulls: a test
# installation runs :test, and "Vrijgeven (productie)" (release.yml)
# moves :stable to a tested version.
#
# amd64 only: the NAS this runs on is an Intel/AMD machine.
#
# Nothing is built before three checks pass: the version in package.json
# must not exist yet (a second build under the same number would quietly
# replace the one that was tested, and "Vrijgeven (productie)" would then
# release the untested one), and the app's and the solver's tests must
# pass. The tests run in the official node/python images, so they need no
# extra actions.
#
# Other people's actions are pinned to a commit, not a tag: a tag can be
# moved to different code later, a commit cannot. The comment says which
# version it is.

name: Bouwen (test)

on:
  workflow_dispatch:
    inputs:
      basispad:
        description: 'Submap waaronder de app draait, bijvoorbeeld /achterwacht. Leeg: de hoofdmap van het adres.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version not built yet
        env:
          VERSIE: ${{ steps.version.outputs.version }}
        run: |
          for name in web solver; do
            if docker manifest inspect "ghcr.io/alitemu/rooster-$name:$VERSIE" > /dev/null 2>&1; then
              echo "::error::Versie $VERSIE bestaat al. Verhoog het versienummer in package.json en bouw opnieuw."
              exit 1
            fi
          done

  test-app:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run

  test-solver:
    runs-on: ubuntu-latest
    container: python:3.11
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: [version, test-app, test-solver]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            context: .
          - name: solver
            context: ./solver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          # Only the web image uses it; the solver ignores an unknown argument.
          build-args: |
            BASE_PATH=${{ inputs.basispad }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alitemu/rooster-${{ matrix.name }}:${{ needs.version.outputs.version }}
            ghcr.io/alitemu/rooster-${{ matrix.name }}:test
          # Links the package to this repository, so it shows up there and
          # takes its public visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            nl.dienstrooster.basispad=${{ inputs.basispad }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        env:
          BASISPAD: ${{ inputs.basispad }}
        run: |
          echo "rooster-${{ matrix.name }} ${{ needs.version.outputs.version }} staat klaar als test (submap: ${BASISPAD:-geen})." >> "$GITHUB_STEP_SUMMARY"
