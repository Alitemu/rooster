# Builds the two images the NAS runs and publishes them to GitHub's
# container registry, so the server only downloads them (docker compose
# pull) and never has to build anything itself:
#
#   ghcr.io/alitemu/rooster-web:<version> and :latest
#   ghcr.io/alitemu/rooster-solver:<version> and :latest
#
# <version> is package.json's "version": raising it (the version shown in
# the app's header) is what makes a release. Runs when package.json
# changes on the main branch, or by hand from the Actions tab.
#
# Both amd64 and arm64: most Synology models are amd64, the "j" and value
# series are arm64. The arm64 half is emulated (QEMU), so a run takes a
# while.

name: Images

on:
  push:
    branches: ['claude/new-session-yinlbo', 'main']
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            context: .
          - name: solver
            context: ./solver
    steps:
      - uses: actions/checkout@v4

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/alitemu/rooster-${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/alitemu/rooster-${{ matrix.name }}:latest
          # Links the package to this repository, so it shows up there and
          # takes its public visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
