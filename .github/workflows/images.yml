# "Bouwen (test)": builds the two images the NAS runs and publishes them
# to GitHub's container registry, so the server only downloads them
# (docker compose pull) and never builds anything itself:
#
#   ghcr.io/alitemu/rooster-web:<version> and :test
#   ghcr.io/alitemu/rooster-solver:<version> and :test
#
# <version> is package.json's "version" (the one in the app's header).
# Only ever started by hand (Actions tab > Bouwen (test) > Run workflow),
# and it never touches :stable, which production pulls: a test
# installation runs :test, and "Vrijgeven (productie)" (release.yml)
# moves :stable to a tested version.
#
# amd64 only: the NAS this runs on is an Intel/AMD machine.

name: Bouwen (test)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: web
            context: .
          - name: solver
            context: ./solver
    steps:
      - uses: actions/checkout@v4

      - name: Version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/alitemu/rooster-${{ matrix.name }}:${{ steps.version.outputs.version }}
            ghcr.io/alitemu/rooster-${{ matrix.name }}:test
          # Links the package to this repository, so it shows up there and
          # takes its public visibility.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        run: echo "rooster-${{ matrix.name }} ${{ steps.version.outputs.version }} staat klaar als test." >> "$GITHUB_STEP_SUMMARY"
